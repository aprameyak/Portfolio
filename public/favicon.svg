<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#purpleGradient)" opacity="0.9"/>
  
  <!-- Letter A -->
  <path d="M30 80 L50 20 L70 80 M35 65 L65 65" 
        stroke="white" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Decorative elements -->
  <circle cx="25" cy="25" r="3" fill="white" opacity="0.6"/>
  <circle cx="75" cy="25" r="3" fill="white" opacity="0.6"/>
  <circle cx="25" cy="75" r="2" fill="white" opacity="0.4"/>
  <circle cx="75" cy="75" r="2" fill="white" opacity="0.4"/>
</svg>
